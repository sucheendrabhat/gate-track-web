<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GATE CSE Tracker — Progress</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app" class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">GATE CSE TRACKER</div>
        <h1>Progress</h1>
      </div>
      <div class="topbar-right">
        <div id="volume-switch" class="pill-switch"></div>
        <div id="synced-at" class="synced"></div>
      </div>
    </header>

    <section class="summary-grid" id="summary-grid"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Weakest subjects first</h2>
        <span class="panel-sub">Ranked by % done — least-done at the top</span>
      </div>
      <div id="chapter-list" class="chapter-list"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Activity</h2>
        <span class="panel-sub">Last 18 weeks</span>
      </div>
      <div class="activity-cards" id="activity-cards"></div>
      <div class="heatmap-wrap">
        <div id="heatmap" class="heatmap"></div>
        <div id="heatmap-hint" class="heatmap-hint">Hover a square to see that day's count.</div>
      </div>
      <details class="daybyday">
        <summary>Day-by-day</summary>
        <table id="daily-table">
          <thead><tr><th>Date</th><th>Total</th><th>L1</th><th>L2</th><th>L3</th></tr></thead>
          <tbody></tbody>
        </table>
      </details>
    </section>

    <footer class="footer">
      Generated from your local GATE CSE Tracker database &middot; <span id="footer-total"></span>
    </footer>
  </div>

<script src="app.js"></script>
</body>
</html>
